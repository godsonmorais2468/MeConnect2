# Render Blueprint for ME-CONNECT (a static site).
# Without the rewrite, opening or refreshing any page address other than "/" (for example /due-list) gets "Not Found" from the host.
# Without the cache headers, a phone can keep an old sw.js or index.html after a new version goes live and then ask for page files that no longer exist.
services:
  - type: web
    name: me-connect
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # the page shell and the service worker must always be checked fresh
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # built files have a hash in their name and never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
